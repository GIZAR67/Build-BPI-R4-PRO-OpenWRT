name: Build BPI-R4-PRO OpenWrt

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  SOURCE_REPO: https://github.com/BPI-SINOVOIP/BPI-R4PRO-8X-OPENWRT-V24.10.0-Master-Devel.git
  SOURCE_BRANCH: main
  OPENWRT_DIR: openwrt

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 720

    steps:
      - name: Checkout Build Repo
        uses: actions/checkout@v4

      - name: Free Disk Space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af || true
          df -h

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib \
            g++-multilib genisoimage git gperf haveged help2man intltool libc6-dev-i386 \
            libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev \
            libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev \
            libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch \
            pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons \
            squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto \
            xxd zlib1g-dev zstd

      - name: Clone Source Tree
        run: |
          git clone --depth 1 --branch "${SOURCE_BRANCH}" "${SOURCE_REPO}" "${OPENWRT_DIR}"

      - name: Fix WiFi Overlay Label (i2c_wifi -> imux3_wifi)
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # Upstream bug: the wifi overlay references &i2c_wifi, but the base
          # DTS labels that bus imux3_wifi. The unresolved fixup makes U-Boot's
          # `fdt apply` fail and the board hangs at boot when the overlay is
          # enabled via bootconf. Point the overlay at the real label.
          DTSO="target/linux/mediatek/files-6.6/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4-pro-8x-wifi-mt7996a.dtso"
          BASE="target/linux/mediatek/files-6.6/arch/arm64/boot/dts/mediatek/mt7988a-bananapi-bpi-r4-pro-8x.dts"
          grep -q 'imux3_wifi' "$BASE" || { echo "ERROR: imux3_wifi label missing in base DTS — upstream changed, re-check"; exit 1; }
          if grep -q '&i2c_wifi' "$DTSO"; then
            sed -i 's/&i2c_wifi\b/\&imux3_wifi/' "$DTSO"
            grep -q '&imux3_wifi' "$DTSO" || { echo "ERROR: patch did not apply"; exit 1; }
            echo "=== patched overlay reference ==="
            grep -n 'imux3_wifi' "$DTSO"
          else
            echo "NOTE: overlay no longer references &i2c_wifi — upstream fixed it, skipping"
          fi

      - name: Add AmneziaWG Feed
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # amneziawg-tools / luci-proto-amneziawg are requested in .config but
          # are not provided by any feed in feeds.conf.default — add the
          # upstream AmneziaWG feed so those packages actually exist to build.
          grep -q '^src-git amneziawg ' feeds.conf.default || \
            echo 'src-git amneziawg https://github.com/amnezia-vpn/amneziawg-openwrt.git' >> feeds.conf.default
          cat feeds.conf.default

      - name: Update And Install Feeds
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          bash ../scripts/install-feeds.sh

      - name: Remove Broken Packages
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # Remove mihomo and its luci app — they fail to build (Go dns library error)
          rm -rf feeds/small/mihomo feeds/small/luci-app-mihomo
          rm -rf package/feeds/small/mihomo package/feeds/small/luci-app-mihomo
          # Also remove from kenzo if present
          rm -rf feeds/kenzo/mihomo feeds/kenzo/luci-app-mihomo
          rm -rf package/feeds/kenzo/mihomo package/feeds/kenzo/luci-app-mihomo
          # nikki/clashoo — та же семья clash. Они ломают kconfig рекурсией
          # (nikki depends on firewall4, clashoo selects firewall4, nikki selects
          # clashoo), из-за чего разбор зависимостей идёт по неверной ветке.
          for P in nikki clashoo luci-app-nikki; do
            rm -rf "feeds/small/$P" "package/feeds/small/$P"
          done
          echo "Removed mihomo/nikki/clashoo packages"

      - name: Load Build Config
        run: |
          cp .config "${OPENWRT_DIR}/.config"

      - name: Expand Config
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          cp .config /tmp/config.requested
          make defconfig
          # Verify mihomo is not enabled
          if grep -q 'CONFIG_PACKAGE_mihomo=y' .config; then
            echo "ERROR: mihomo still enabled!"
            exit 1
          fi
          grep -E "CONFIG_TARGET_|CONFIG_TARGET_ROOTFS_(INITRAMFS|INITRAMFS_SEPARATE|SQUASHFS)" .config

          # make defconfig SILENTLY drops CONFIG_PACKAGE_* symbols that no feed
          # provides. Without this check a missing zapret or kmod-* would only
          # surface an hour later, as an absence in the finished image. Fail now.
          echo "=== Verify every requested package survived defconfig ==="
          MISSING=""
          while read -r sym; do
            grep -q "^${sym}=y\$" .config || MISSING="${MISSING} ${sym}"
          done < <(sed -n 's/^\(CONFIG_PACKAGE_[A-Za-z0-9_.+-]*\)=y$/\1/p' /tmp/config.requested)
          if [ -n "${MISSING}" ]; then
            echo "ERROR: packages dropped by defconfig (absent from feeds or unmet deps):"
            for m in ${MISSING}; do echo "  - ${m}"; done
            echo "--- installed feeds ---"
            ls -1 package/feeds/ 2>/dev/null || true
            exit 1
          fi
          echo "OK: all requested packages present"

          # LUCI_LANG_ru only *enables* the hidden luci-i18n-*-ru packages; confirm
          # the expansion actually produced them, otherwise the UI ships English.
          if grep -q '^CONFIG_LUCI_LANG_ru=y$' /tmp/config.requested; then
            if ! grep -q '^CONFIG_PACKAGE_luci-i18n-base-ru=y$' .config; then
              echo "ERROR: CONFIG_LUCI_LANG_ru=y did not pull in luci-i18n-base-ru"
              exit 1
            fi
            echo "OK: Russian LuCI translations enabled ($(grep -c '^CONFIG_PACKAGE_luci-i18n-.*-ru=y$' .config) packages)"
          fi

      - name: Prepare Linux Firmware Source
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          make package/firmware/linux-firmware/download -j1 V=s
          make package/firmware/linux-firmware/prepare -j1 V=s

      - name: Download Sources
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # Drop truncated downloads — a failed fetch leaves a stub where a tarball
          # should be. -maxdepth 1 -type f is not cosmetic: the source tree ships a
          # populated dl/go-mod-cache (extracted Go modules), and an unscoped sweep
          # deletes every module file under 1 KB. That is what killed run
          # 31959567238: whole packages whose files are all tiny — sing's
          # common/{logger,debug,auth,random,replay}, protobuf's
          # internal/editiondefaults, utls's internal/{boring,helper} — vanished,
          # and xray-core failed with "no required module provides package ..."
          # while the module itself sat right there in the cache. Go never repairs
          # it: the module directory exists, so it is not re-extracted.
          find dl -maxdepth 1 -type f -size -1024c -delete
          make download -j"$(nproc)" || make download -j1 V=s

      - name: Apply Custom Files Overlay
        run: |
          # Всё из files/ попадает в корень образа как есть (штатный механизм OpenWrt).
          [ -d files ] || { echo "files/ нет — пропускаю"; exit 0; }
          mkdir -p "${OPENWRT_DIR}/files"
          cp -a files/. "${OPENWRT_DIR}/files/"
          # Право на исполнение git хранит, но копия через архив его теряла — ставим явно.
          find "${OPENWRT_DIR}/files/usr/bin" "${OPENWRT_DIR}/files/etc/uci-defaults" \
            "${OPENWRT_DIR}/files/etc/init.d" "${OPENWRT_DIR}/files/etc/hotplug.d" \
            -type f -exec chmod 0755 {} + 2>/dev/null || true
          find "${OPENWRT_DIR}/files" -type f | sed "s|^|overlay: |"

      - name: Build Firmware
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          # The stages below are `world` spelled out by hand, in its own order:
          #   prepare -> target/compile -> package/compile -> package/install
          #           -> target/install -> package/index + json + checksum
          # (see the `world:` rule in the top-level Makefile). Spelling it out is what
          # lets the image assembly run at -j1 while everything else stays parallel —
          # but it also means NOTHING pulls a missing stage in for us: `package/install`
          # does not depend on `package/compile`, only `world` puts them in order.
          # Skipping package/compile cost run 31935559562 an hour (host opkg missing).

          # Step 1: prepare == host tools + toolchain (+ buildinfo)
          echo "=== Building tools and toolchain ==="
          make prepare -j"$(nproc)" V=s BUILD_LOG=1 2>&1 | tail -10 || true

          # Step 2: Build kernel (unpacks source, runs syncconfig, compiles)
          # Console output is tailed to 20 lines; BUILD_LOG=1 keeps the full text
          # in logs/ so a kernel-stage failure is still readable after the fact.
          echo "=== Building kernel ==="
          make target/compile -j"$(nproc)" V=s BUILD_LOG=1 2>&1 | tail -20 || true
          
          # BUILD_LOG=1 tees every sub-make into logs/<subdir>/<target>.txt. Without it
          # the parallel make swallows the failing command's output and leaves only a
          # bare "ERROR: target/linux failed to build.", which says nothing about why.
          # Called before every serial retry, so the evidence survives the rerun.
          dump_logs() {
            echo "=== build FAILED — dumping the logs it left behind ==="
            # Newest logs first: the failing target is almost always among them.
            find logs -name '*.txt' -printf '%T@ %p\n' 2>/dev/null | sort -rn | head -5 |
              while read -r _ LOGFILE; do
                echo "----------------- tail of $LOGFILE -----------------"
                tail -80 "$LOGFILE"
              done
            # Keep them: the -j1 retry would otherwise overwrite the evidence.
            # Never let the bookkeeping abort the step — the retry matters more.
            rm -rf logs-parallel-failure || true
            [ -d logs ] && mv logs logs-parallel-failure || echo "(no logs/ dir produced)"
          }

          # Step 3: Compile the packages — parallel, this part scales fine.
          # Also where the host opkg comes from: package/Makefile hangs
          # `package/system/opkg/host/compile` off this target and off nothing else.
          echo "=== Building packages (parallel) ==="
          if ! make -j"$(nproc)" package/compile BUILD_LOG=1; then
            dump_logs
            echo "=== retrying package build serially ==="
            make -j1 V=s package/compile
          fi

          # Step 3b: Install the built packages into the rootfs tree.
          echo "=== Installing packages into the rootfs ==="
          if ! make -j"$(nproc)" package/install BUILD_LOG=1; then
            dump_logs
            echo "=== retrying package install serially ==="
            make -j1 V=s package/install
          fi

          # Step 4: Assemble the images SERIALLY — deliberately, not as a retry.
          #
          # ubinize builds snand-factory.bin with a "recovery" volume whose source
          # (...-initramfs-recovery.itb) is produced by a sibling job, and the upstream
          # recipe never declares that dependency. Under -j it loses the race and the
          # whole run dies with `ubinize: error!: cannot stat ... referred from section
          # "recovery"` (seen in runs 31921227258 and 31930683282); under -j1 the
          # ordering is serial and it always works. Costs ~7 min out of ~1 h 25 min.
          echo "=== Assembling images (serial: upstream ubinize race, see comment) ==="
          if ! make -j1 target/install BUILD_LOG=1; then
            dump_logs
            exit 1
          fi

          # Step 5: Finish world — exactly what the `world:` recipe runs after
          # target/install. Spelled out rather than a bare `make`, so a stale or
          # missing stamp can never drag the image assembly back into a parallel run.
          echo "=== Finishing world (indexes, checksums, buildinfo) ==="
          if ! make -j"$(nproc)" package/index json_overview_image_info checksum BUILD_LOG=1; then
            dump_logs
            echo "=== retrying serially ==="
            make -j1 V=s package/index json_overview_image_info checksum
          fi

      # Runs even when the build dies, so a failed run still yields something to read.
      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.run_id }}
          path: |
            ${{ env.OPENWRT_DIR }}/logs
            ${{ env.OPENWRT_DIR }}/logs-parallel-failure
          if-no-files-found: warn
          retention-days: 14

      - name: Verify Official SD Card Image
        working-directory: ${{ env.OPENWRT_DIR }}
        run: |
          ls -lh bin/targets/mediatek/filogic
          test -f bin/targets/mediatek/filogic/openwrt-mediatek-filogic-bananapi_bpi-r4-pro-8x-sdcard.img.gz
          # The wifi overlay inside the FIT must reference imux3_wifi, not the
          # nonexistent i2c_wifi label (unresolved fixup = boot hang).
          for ITB in bin/targets/mediatek/filogic/*bpi-r4-pro-8x*sysupgrade.itb; do
            ls -lh "$ITB"
            if strings "$ITB" | grep -qw 'i2c_wifi'; then
              echo "ERROR: $ITB still contains i2c_wifi fixup"
              exit 1
            fi
            strings "$ITB" | grep -qw 'imux3_wifi' && echo "OK: $ITB overlay fixup points to imux3_wifi"
          done

          # The hand-rolled TUN/WireGuard kernel-config forcing was removed: those
          # modules arrive as ordinary packages (KCONFIG in the kmod definitions),
          # which is what the released images actually shipped. Prove it per build
          # instead of trusting the reasoning — a silent loss here means no VPN.
          echo "=== Verify tunnel modules are in the image manifest ==="
          MANIFEST="$(ls bin/targets/mediatek/filogic/*.manifest | head -1)"
          echo "manifest: ${MANIFEST}"
          # luci/uhttpd — веб-интерфейс: без него роутер настраивается только по SSH
          # (так и вышло на домашней Банане 16.08.2026). dnsmasq-full — поддержка
          # nftset, на ней держится раздельный доступ; базовый dnsmasq идёт с no-nftset.
          for PKG in kmod-tun kmod-wireguard kmod-amneziawg amneziawg-tools \
                     luci uhttpd luci-app-firewall dnsmasq-full block-mount qrencode \
                     samba4-server ksmbd-server p910nd omcproxy openvpn-openssl \
                     xray-core sing-box podkop luci-app-ssr-plus usbutils kmod-nvme; do
            if grep -q "^${PKG} " "${MANIFEST}"; then
              echo "  OK: ${PKG} $(grep "^${PKG} " "${MANIFEST}" | awk '{print $2}')"
            else
              echo "  ERROR: ${PKG} missing from the image manifest"
              MISSING_KMOD=1
            fi
          done
          [ -z "${MISSING_KMOD}" ] || exit 1

      - name: Prepare Release Files
        id: meta
        run: |
          BUILD_DATE="$(date -u +%Y%m%d-%H%M)"
          SOURCE_COMMIT="$(git -C "${OPENWRT_DIR}" rev-parse HEAD)"
          TAG="bpi-r4-pro-${BUILD_DATE}-r${GITHUB_RUN_ID}a${GITHUB_RUN_ATTEMPT}"
          mkdir -p release
          cp -a "${OPENWRT_DIR}/bin/targets/mediatek/filogic/." release/
          cp "${OPENWRT_DIR}/.config" release/build.config
          rm -rf release/packages
          {
            echo "Source repository: ${SOURCE_REPO}"
            echo "Source branch: ${SOURCE_BRANCH}"
            echo "Source commit: ${SOURCE_COMMIT}"
            echo "GitHub Actions run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          } > release/RELEASE.txt
          echo "build_date=${BUILD_DATE}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bpi-r4-pro-openwrt-${{ steps.meta.outputs.build_date }}
          path: release/*
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: BPI-R4-PRO OpenWrt ${{ steps.meta.outputs.build_date }}
          body_path: release/RELEASE.txt
          files: release/*
          fail_on_unmatched_files: true
